<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="القبطان">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>منظفات القبطان</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="hero">
  <div class="logo"><img src="logo.jpg" alt="شعار منظفات القبطان"></div>
  <h1>منظفات القبطان</h1><p class="slogan">نظافة .. ثقة .. جودة</p><span class="chip">توصيل داخل الفيوم</span>
</div>
<nav class="tabs"><button data-tab="shop" class="on">المنتجات</button><button data-tab="cart">السلة <b id="badge" hidden>0</b></button><button data-tab="orders">طلباتي <b id="obadge" hidden>0</b></button></nav>
<main id="view"></main>
<script src="products.js"></script>
<script src="app.js"></script>
<script>if(typeof MYO==='undefined'&&!sessionStorage.getItem('rl')){sessionStorage.setItem('rl','1');caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))).then(()=>navigator.serviceWorker.getRegistrations()).then(r=>Promise.all(r.map(x=>x.unregister()))).catch(()=>{}).then(()=>location.reload())}</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script>
</body>
</html>
