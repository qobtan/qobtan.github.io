<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>فاتورة - منظفات القبطان</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#0b2a4a}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.inv{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(11,42,74,.12)}
.hd{background:linear-gradient(135deg,#0b2a4a,#123a63);color:#f5c945;text-align:center;padding:18px 12px;border-bottom:3px solid #f5c945}
.hd img{width:64px;height:64px;border-radius:50%;border:2px solid #f5c945;object-fit:cover}.hd h1{margin:8px 0 2px;font-size:22px}.hd p{margin:0;font-size:13px;color:#dbe4f0}
.bd{padding:16px}.meta{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:10px}.meta b{font-size:18px}
.box{background:#f6f8fb;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.8;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#0b2a4a;color:#f5c945;padding:8px;text-align:right;font-size:13px}td{padding:9px 8px;border-bottom:1px solid #eef1f6}td.n,th.n{text-align:center;white-space:nowrap}
.tot{margin-top:12px;font-size:15px}.tot div{display:flex;justify-content:space-between;padding:5px 0}.tot .g{background:#0b2a4a;color:#f5c945;border-radius:12px;padding:12px;margin-top:6px;font-size:19px;font-weight:700}
.ft{text-align:center;padding:14px;font-size:14px;color:#33465c;border-top:1px dashed #d8dee7}.ft b{color:#0b2a4a}
.btns{display:flex;gap:8px;margin-top:12px}.btns button{flex:1;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;background:#f5c945;color:#0b2a4a}
.msg{text-align:center;padding:40px 10px;color:#6b7a8c}
@media print{body{background:#fff}.btns{display:none}.inv{box-shadow:none;border-radius:0}.wrap{padding:0;max-width:none}.hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}th,.tot .g{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body><div class="wrap" id="app"><div class="msg">بيحمّل الفاتورة...</div></div>
<script>
const U='https://aiqfiiuozweqbqlgivqj.supabase.co',K='sb_publishable_POz8lTd9lNj2xId7tzghHQ_dkEbX3n9';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round(n*100)/100).toLocaleString('en-US')+' ج.م';
const q=new URLSearchParams(location.search);
(async()=>{
  const app=document.getElementById('app');
  try{
    const r=await fetch(U+'/rest/v1/rpc/get_invoice',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({p_id:+q.get('id'),p_token:q.get('t')})});
    const o=r.ok?await r.json():null;
    if(!o){app.innerHTML='<div class="msg">الفاتورة مش موجودة أو اللينك غلط.</div>';return;}
    const its=o.items||[];const sub=its.reduce((s,i)=>s+(+i.qty||0)*(+i.price||0),0);
    const fee=+o.delivery_fee||Math.max(0,(+o.total||0)-sub);
    const d=new Date(o.created_at).toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric',timeZone:'Africa/Cairo'});
    const pay=o.payment==='vodafone'?'فودافون كاش':'كاش عند الاستلام';
    app.innerHTML=`<div class="inv"><div class="hd"><img src="logo.jpg" alt=""><h1>منظفات القبطان</h1><p>نظافة .. ثقة .. جودة</p></div><div class="bd">
    <div class="meta"><div>فاتورة رقم<br><b>#${o.id}</b></div><div style="text-align:left">التاريخ<br><b style="font-size:15px">${esc(d)}</b></div></div>
    <div class="box"><b>${esc(o.customer_name)}</b><br>📞 ${esc(o.phone)}<br>📍 ${esc(o.address)}${o.city?' - '+esc(o.city):''}</div>
    <table><thead><tr><th>الصنف</th><th class="n">الكمية</th><th class="n">السعر</th><th class="n">الإجمالي</th></tr></thead><tbody>${its.map(i=>`<tr><td>${esc(i.name)}</td><td class="n">${+i.qty}</td><td class="n">${+i.price}</td><td class="n">${(+i.qty)*(+i.price)}</td></tr>`).join('')}</tbody></table>
    <div class="tot"><div><span>إجمالي المنتجات</span><b>${money(sub)}</b></div><div><span>خدمة التوصيل</span><b>${money(fee)}</b></div><div class="g"><span>الإجمالي المطلوب</span><span>${money(+o.total)}</span></div><div style="margin-top:6px"><span>طريقة الدفع</span><b>${pay}</b></div></div>
    </div><div class="ft"><b>شكراً لثقتك في منظفات القبطان 🌹</b></div></div>
    <div class="btns"><button type="button" id="pr">🖨️ طباعة / PDF</button><button type="button" id="im">🖼️ حفظ كصورة</button></div>`;
    document.title='فاتورة #'+o.id+' - منظفات القبطان';
    document.getElementById('im').onclick=async()=>{const b=document.getElementById('im');b.textContent='بيجهّز...';try{if(!window.html2canvas){await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s);});}const cv=await html2canvas(document.querySelector('.inv'),{scale:2,backgroundColor:'#ffffff',useCORS:true});const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='invoice-'+o.id+'.png';document.body.appendChild(a);a.click();a.remove();b.textContent='🖼️ حفظ كصورة';}catch(e){b.textContent='مش اشتغلت، استخدم طباعة / PDF';}};
    document.getElementById('pr').onclick=()=>{try{if(window.AndroidFCM&&AndroidFCM.print){AndroidFCM.print();return;}}catch(e){}window.print();};
  }catch(e){app.innerHTML='<div class="msg">مشكلة في الاتصال — جرّب تاني.</div>';}
})();
</script></body></html>
