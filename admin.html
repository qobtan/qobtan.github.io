<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<meta name="robots" content="noindex">
<title>إدارة المنتجات — منظفات القبطان</title>
<link rel="stylesheet" href="app.css">
<style>
body{background:#f4f6f9}
.awrap{max-width:640px;margin:0 auto;padding:12px 12px 80px}
.ahead{background:linear-gradient(135deg,#0b2a4a,#123a63);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
.ahead h1{font-size:20px;margin:0 0 4px;color:#f5c945}
.ahead p{margin:0;font-size:13px;opacity:.85}
.pinbox,.pcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(11,42,74,.08)}
.pinbox input,.pcard input[type=text],.pcard input[type=number],.pcard textarea{width:100%;box-sizing:border-box;border:1px solid #d8dee7;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;margin-top:4px}
.pinbox button,.abtn{background:#f5c945;color:#0b2a4a;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
.abtn.sec{background:#0b2a4a;color:#f5c945}
.abtn.danger{background:#fbe3e3;color:#b3261e}
.abtn:disabled{opacity:.5}
.lbl{font-size:13px;color:#0b2a4a;font-weight:700;display:block;margin-top:10px}
.prow{display:flex;gap:10px;align-items:flex-start}
.prow img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #e3e8f0;flex:none}
.pbody{flex:1;min-width:0}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.ok{color:#137a3f}.msg.err{color:#b3261e}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.topbar a{font-size:13px;color:#0b2a4a}
.filebtn{font-size:13px;color:#0b2a4a;text-decoration:underline;cursor:pointer;background:none;border:0;padding:6px 0}
.hint2{font-size:12px;color:#667}
</style>
</head>
<body>
<div class="awrap">
  <div class="ahead"><h1>إدارة المنتجات</h1><p>منظفات القبطان — شاشة خاصة بالمالك</p></div>
  <div class="pinbox" id="pinbox">
    <label class="lbl" style="margin-top:0">الرقم السري</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••••">
    <button id="enter">دخول</button>
    <div class="msg" id="pinmsg"></div>
  </div>
  <div id="panel" hidden>
    <div class="topbar">
      <a href="./" >‹ عرض المتجر</a>
      <button class="filebtn" id="logout">خروج</button>
    </div>
    <div class="pcard">
      <button class="abtn sec" id="addnew" type="button">+ إضافة منتج جديد</button>
    </div>
    <div id="list"></div>
    <div class="pcard">
      <b style="font-size:14px;color:#0b2a4a">تغيير الرقم السري</b>
      <label class="lbl">الرقم الحالي</label>
      <input type="password" id="oldpin" inputmode="numeric" autocomplete="off">
      <label class="lbl">الرقم الجديد (٤ أرقام أو أكتر)</label>
      <input type="password" id="newpin" inputmode="numeric" autocomplete="off">
      <button class="abtn" id="changepin" type="button">تغيير الرقم</button>
      <div class="msg" id="pin2msg"></div>
      <div class="hint2">بعد التغيير هتدخل بالرقم الجديد من أي موبايل.</div>
    </div>
  </div>
</div>
<script src="admin.js"></script>
</body>
</html>
