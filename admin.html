<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<meta name="robots" content="noindex">
<title>إدارة الطلبات والمنتجات — منظفات القبطان</title>
<link rel="stylesheet" href="app.css">
<style>
body{background:#f4f6f9}
.awrap{max-width:640px;margin:0 auto;padding:12px 12px 80px}
.ahead{background:linear-gradient(135deg,#0b2a4a,#123a63);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;text-align:center}
.ahead h1{font-size:20px;margin:0 0 4px;color:#f5c945}
.ahead p{margin:0;font-size:13px;opacity:.85}
.pinbox,.pcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(11,42,74,.08)}
.pinbox input,.pcard input[type=text],.pcard input[type=number],.pcard textarea{width:100%;box-sizing:border-box;border:1px solid #d8dee7;border-radius:10px;padding:10px;font-size:15px;font-family:inherit;margin-top:4px}
.pinbox button,.abtn{background:#f5c945;color:#0b2a4a;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}
.abtn.sec{background:#0b2a4a;color:#f5c945}
.abtn.danger{background:#fbe3e3;color:#b3261e}
.abtn:disabled{opacity:.5}
.lbl{font-size:13px;color:#0b2a4a;font-weight:700;display:block;margin-top:10px}
.prow{display:flex;gap:10px;align-items:flex-start}
.prow img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid #e3e8f0;flex:none}
.pbody{flex:1;min-width:0}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.ok{color:#137a3f}.msg.err{color:#b3261e}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.topbar a{font-size:13px;color:#0b2a4a}
.filebtn{font-size:13px;color:#0b2a4a;text-decoration:underline;cursor:pointer;background:none;border:0;padding:6px 0}
.ord{border:1px solid #e3e8f0;border-radius:12px;padding:10px;margin-top:10px;font-size:14px}.ord.new{border-color:#f5c945;background:#fffbea}.ord small{color:#667}.ord select{width:100%;padding:8px;border-radius:8px;margin-top:6px;font-family:inherit}.ohd{display:flex;justify-content:space-between;align-items:center}.bd{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:#e8edf4;color:#0b2a4a}.bd.s-new{background:#f5c945}.bd.s-confirmed{background:#cfe3ff}.bd.s-delivered{background:#d3f2df;color:#137a3f}.bd.s-canceled{background:#fbe3e3;color:#b3261e}.ocu{margin:8px 0;line-height:1.7}.oit{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid #eef1f6}.oit img{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid #e3e8f0;flex:none}.oib{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}.oib span{color:#667}.oil{font-weight:700;font-size:13px;white-space:nowrap}.otot{display:flex;justify-content:space-between;align-items:center;background:#0b2a4a;color:#f5c945;border-radius:10px;padding:10px;margin-top:8px;font-size:13px}.otot b{font-size:15px}.oact{display:flex;gap:8px;margin-top:10px}.ob{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:700;text-decoration:none;font-size:14px}.ob.call{background:#f5c945;color:#0b2a4a}.ob.wa2{background:#1a9a52;color:#fff}.hint2{font-size:12px;color:#667}

.tabsec{display:none}.tabsec.on{display:block}
.bnav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0b2a4a;border-top:2px solid #f5c945;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bnav[hidden]{display:none}
.bnav button{flex:1;background:none;border:0;color:#cfd8e6;padding:10px 4px 9px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;position:relative}
.bnav button span{display:block;font-size:20px;line-height:1.1}
.bnav button.on{color:#f5c945;background:#123a63}
.nbadge{position:absolute;top:4px;left:50%;margin-left:10px;background:#d93025;color:#fff;border-radius:10px;min-width:18px;padding:0 5px;font-size:11px;line-height:18px}
.otot:not([style]) span{color:#fff!important}.otot:not([style]) b{color:#f5c945}
.stitle{font-size:18px;color:#0b2a4a;font-weight:800;margin:4px 2px 10px}
.awrap{padding-bottom:96px}

.ochips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;margin:0 -2px;-webkit-overflow-scrolling:touch}
.ochip{flex:none;border:1px solid #d8c27a;background:#fff;color:#0b2a4a;border-radius:999px;padding:7px 12px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
.ochip i{font-style:normal;background:#eef1f6;border-radius:999px;padding:0 7px;font-size:12px;line-height:19px}
.ochip.on{background:#0b2a4a;color:#f5c945;border-color:#0b2a4a}.ochip.on i{background:#f5c945;color:#0b2a4a}
.oc{background:#fff;border-radius:16px;padding:14px 14px 12px;margin-top:12px;box-shadow:0 2px 10px rgba(11,42,74,.10);border-inline-start:5px solid #c9d2df;position:relative}
.oc.st-new{border-inline-start-color:#f5c945;background:linear-gradient(180deg,#fffbea,#fff 55%)}
.oc.st-confirmed{border-inline-start-color:#4a8be8}.oc.st-shipping{border-inline-start-color:#8a5be8}
.oc.st-delivered{border-inline-start-color:#1a9a52}.oc.st-canceled{border-inline-start-color:#d93025;opacity:.72}
.oc-h{display:flex;align-items:center;gap:8px}.oc-id{font-size:17px;color:#0b2a4a}.oc-t{margin-inline-start:auto;font-size:12px;color:#667}
.oc .bd.s-shipping{background:#e5dcff;color:#4b2bb0}
.oc-who{font-size:19px;font-weight:800;color:#0b2a4a;margin:8px 0 2px}
.oc-ad{font-size:13.5px;color:#445;line-height:1.5}
.oc-ct{display:flex;gap:8px;margin-top:10px}.oc-ct .ob{padding:9px 10px;font-size:14px;direction:ltr}
.oc-ct .call{flex:2}.oc-ct .wa2{flex:1;direction:rtl}
.oc-it{margin-top:10px;border:1px solid #e6ebf2;border-radius:12px;padding:0 10px;background:#fafbfd}
.oc-it summary{cursor:pointer;padding:10px 0;font-size:13.5px;font-weight:700;color:#0b2a4a;list-style:none}
.oc-it summary::-webkit-details-marker{display:none}.oc-it summary::after{content:' ▾';color:#b8892b}
.oc-it[open] summary{border-bottom:1px solid #eef1f6}
.oc-tot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;background:linear-gradient(135deg,#0b2a4a,#143f6c);color:#fff;border-radius:12px;padding:10px 14px}
.oc-tot .pay{font-size:13px;opacity:.95}.oc-tot .amt{font-size:22px;font-weight:800;color:#f5c945}.oc-tot .amt small{font-size:12px;font-weight:700}
.oc-fee{font-size:12px;color:#667;margin:5px 4px 0}
.oc-rt{margin-top:8px;display:flex;gap:10px;align-items:center;background:#fffbea;border:1px solid #f5c945;border-radius:10px;padding:7px 10px;font-size:13px;color:#0b2a4a}.oc-rt b{color:#b8892b;letter-spacing:2px;font-size:15px}
.oc-next{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:800;background:#f5c945;color:#0b2a4a;cursor:pointer;box-shadow:0 2px 0 #c79d1f}.oc-next:disabled{opacity:.5}
.oc-st{display:flex;align-items:center;gap:8px;margin-top:10px}.oc-st label{font-size:12px;color:#667;white-space:nowrap}.oc-st select{margin:0!important;padding:7px!important;font-size:13px}
.oc .msg{margin-top:4px;min-height:0}
</style>
</head>
<body>
<div class="awrap">
  <div class="ahead"><h1>إدارة المتجر</h1><p>منظفات القبطان — شاشة خاصة بالمالك</p></div>
  <div class="pinbox" id="pinbox">
    <label class="lbl" style="margin-top:0">الرقم السري</label>
    <input type="password" id="pin" inputmode="numeric" autocomplete="off" placeholder="••••••">
    <button id="enter">دخول</button>
    <div class="msg" id="pinmsg"></div>
  </div>
  <div id="panel" hidden>
    <div class="topbar">
      <a href="./" >‹ عرض المتجر</a>
      <button class="filebtn" id="logout">خروج</button>
    </div>
    <div class="tabsec on" id="sec-orders">
    <div class="stitle">🧾 الطلبات</div>
    <div class="pcard">
      <button class="abtn sec" id="reloadord" type="button" style="margin-top:0">تحديث الطلبات</button>
      <div id="orders"></div>
    </div>
    </div>
    <div class="tabsec" id="sec-settings">
    <div class="stitle">⚙️ الإعدادات</div>
    <div class="pcard">
      <b style="font-size:14px;color:#0b2a4a">خدمة التوصيل (ج.م)</b>
      <input type="number" id="feeval" inputmode="numeric" min="0" style="width:100%;padding:10px;margin:8px 0;border:1px solid #cdd5e0;border-radius:10px;font-size:16px">
      <button class="abtn" id="savefee" type="button">حفظ خدمة التوصيل</button>
      <div class="msg" id="feemsg"></div>
    </div>
    <div class="pcard">
      <b style="font-size:14px;color:#0b2a4a">رقم فودافون كاش</b>
      <input type="tel" id="vfval" inputmode="numeric" placeholder="01XXXXXXXXX" style="width:100%;padding:10px;margin:8px 0;border:1px solid #cdd5e0;border-radius:10px;font-size:16px;direction:ltr;text-align:right">
      <button class="abtn" id="savevf" type="button">حفظ رقم فودافون كاش</button>
      <div class="msg" id="vfmsg"></div>
    </div>
    <div class="pcard">
      <b style="font-size:14px;color:#0b2a4a">تغيير الرقم السري</b>
      <label class="lbl">الرقم الحالي</label>
      <input type="password" id="oldpin" inputmode="numeric" autocomplete="off">
      <label class="lbl">الرقم الجديد (٤ أرقام أو أكتر)</label>
      <input type="password" id="newpin" inputmode="numeric" autocomplete="off">
      <button class="abtn" id="changepin" type="button">تغيير الرقم</button>
      <div class="msg" id="pin2msg"></div>
      <div class="hint2">بعد التغيير هتدخل بالرقم الجديد من أي موبايل.</div>
    </div>
    </div>
    <div class="tabsec" id="sec-products">
    <div class="stitle">🧴 المنتجات</div>
    <div class="pcard">
      <button class="abtn sec" id="addnew" type="button">+ إضافة منتج جديد</button>
    </div>
    <div id="list"></div>
    </div>
  </div>
</div>
<nav class="bnav" id="bnav" hidden>
  <button data-sec="orders" class="on" type="button"><span>🧾</span>الطلبات<i class="nbadge" id="nbnew" hidden></i></button>
  <button data-sec="products" type="button"><span>🧴</span>المنتجات</button>
  <button data-sec="settings" type="button"><span>⚙️</span>الإعدادات</button>
</nav>
<script src="admin.js?v=42"></script>
</body>
</html>
